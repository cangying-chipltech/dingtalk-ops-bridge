[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dingtalk-ops-bridge"
version = "0.1.0"
description = "DingTalk command bridge with concurrent actions and webhook monitoring"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
